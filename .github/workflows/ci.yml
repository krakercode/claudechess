name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Chess logic and puzzle set
        run: node --experimental-strip-types --test tests/*.spec.ts
      - name: Puzzles checked with python-chess
        run: |
          pip install chess==1.10.0
          node --experimental-strip-types -e "import('./hooks/puzzles.ts').then(m => console.log(JSON.stringify(m.PUZZLES)))" \
            | python3 scripts/check_puzzles.py
